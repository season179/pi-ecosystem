name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test --workspace @season179/pi-memory
      - run: npm test --workspace @season179/pi-buddy
      - run: npm test --workspace @season179/pi-herdr
      - run: npm pack --workspace @season179/pi-worktree --dry-run
      - run: npm pack --workspace @season179/pi-buddy --dry-run
      - run: npm pack --workspace @season179/pi-herdr --dry-run
      - run: npm pack --workspace @season179/pi-model-fallback --dry-run
      - run: npm pack --workspace @season179/pi-memory --dry-run
